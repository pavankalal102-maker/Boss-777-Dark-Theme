name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Assets & Web Directory
        run: |
          mkdir -p www assets

          # Copy root project files into www without recursing into www
          find . -maxdepth 1 ! -name '.' ! -name 'www' ! -name '.git' ! -name '.github' -exec cp -r {} www/ \;

          if [ -f logo.png ]; then
            cp logo.png assets/icon-only.png
            cp logo.png assets/icon-foreground.png
            cp logo.png assets/icon-background.png
            cp logo.png assets/icon.png
          else
            cat << 'EOF' > assets/icon.png
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="#ffffff"/></svg>
EOF
          fi

          cat << 'EOF' > assets/splash.svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <rect width="2732" height="2732" fill="#FFFFFF"/>
</svg>
EOF

          cat << 'EOF' > assets/splash-dark.svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <rect width="2732" height="2732" fill="#FFFFFF"/>
</svg>
EOF

      - name: Install Capacitor Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest @capacitor/app@latest

      - name: Initialize & Sync Capacitor Project
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "BOSS777" "com.boss777.hub" --web-dir www
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff" || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOSS777-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
